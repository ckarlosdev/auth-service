# ====================================================
# ----------------------------------------------------
#                   PRODUCTION
# ----------------------------------------------------
# ====================================================


server.port=${PORT}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER_H}
spring.datasource.password=${DB_PASSWORD_H}
spring.datasource.url=${DB_URL_H}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=900000

# ----------------------------------------------------
# CONFIGURACIN DE CORREO ELECTRNICO (AUTH-SERVICE)
# ----------------------------------------------------

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${EMAIL_SERVICE}

spring.mail.password=${PASSWORD_APP_SERVICE}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# HIKARI CONFIG (IMPORTANTE)
# ===============================

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1 

spring.datasource.hikari.max-lifetime=540000


spring.datasource.hikari.keepalive-time=30000

spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
